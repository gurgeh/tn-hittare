<?xml version="1.0" encoding="UTF-8"?>
<!-- Square markers for cm-chessboard's Markers extension. Written for tn-hittare, MIT like the repository. -->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <g id="markerSquare"><rect x="0" y="0" width="40" height="40"/></g>
  <g id="markerFrame"><rect x="1.5" y="1.5" width="37" height="37" fill="none" stroke-width="3"/></g>
  <g id="markerCircle"><circle cx="20" cy="20" r="17" fill="none" stroke-width="3"/></g>
  <g id="markerCircleFilled"><circle cx="20" cy="20" r="17"/></g>
  <g id="markerDot"><circle cx="20" cy="20" r="6"/></g>
  <g id="markerBevel"><rect x="0" y="0" width="40" height="40" fill="none" stroke-width="2"/></g>
</svg>
