<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tn-hittare</title>
<link rel="stylesheet" href="/static/vendor/cm-chessboard/assets/chessboard.css">
<link rel="stylesheet" href="/static/vendor/cm-chessboard/assets/extensions/arrows/arrows.css">
<link rel="stylesheet" href="/static/vendor/cm-chessboard/assets/extensions/promotion-dialog/promotion-dialog.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="bar">
  <span class="grp" title="Filters apply to every number in the database columns">
    <label>Years <input id="y0" type="number" min="1900" max="2100" placeholder="from"></label>–<input id="y1" type="number" min="1900" max="2100" placeholder="to">
  </span>
  <span class="grp" title="Mean rating of the two players, in 200-point bands. Any limit drops games with a missing rating">
    <label>Rating <select id="e0"></select></label>–<select id="e1"></select>
  </span>
  <span class="grp" id="tempi" title="Tempo as decided in games.parquet"></span>
  <span class="grp" title="FIDE ratings of White and Black, for both models: model 1 for the side to move, model 2 for every position">
    <label>White <input id="white" type="number" min="0" max="4000" step="50"></label>
    <label>Black <input id="black" type="number" min="0" max="4000" step="50"></label>
  </span>
  <span id="source" class="dim"></span>
</header>
<main>
  <section id="left">
    <div id="board"></div>
    <div id="nav">
      <button data-k="start" title="Home">|&lt;</button><button data-k="back" title="←">&lt;</button><button data-k="forward" title="→">&gt;</button><button data-k="end" title="End">&gt;|</button><button data-k="flip" title="f">flip</button><button data-k="engine" title="e: the engine on or off">engine</button><button data-k="delete" title="Del: delete this move and what follows">del</button><button data-k="promote" title="p: make this line the main line">promote</button>
    </div>
    <div id="moves" tabindex="-1"></div>
    <textarea id="paste" rows="2" spellcheck="false" placeholder="Paste FEN or PGN, Enter to load (/ to focus, Ctrl+V anywhere)"></textarea>
    <div id="fen" class="dim mono" title="FEN of the position shown (click to copy)"></div>
    <div id="replines" style="display:none"></div>
  </section>
  <section id="right">
    <div id="totals"></div>
    <div id="orders" class="dim"></div>
    <div id="models"></div>
    <div id="engine">
      <div id="enghead">
        <label title="A UCI engine analysing the position shown, until it changes">Engine <select id="eng"></select></label>
        <label title="How many lines (MultiPV)">Lines <select id="mpv"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>8</option></select></label>
        <span id="engset"></span>
        <span id="engstat" class="dim"></span>
      </div>
      <div id="englines"></div>
      <div id="engstrings" class="dim mono"></div>
    </div>
    <div id="repline" style="display:none"></div>
    <table id="tbl">
      <colgroup id="cols"></colgroup>
      <thead><tr></tr></thead>
      <tbody></tbody>
    </table>
    <div id="stubs">
      <button disabled title="Statistics under best play, with shrinkage toward the model: not wired yet (tnh.builder)">Best-play stats</button>
      <span class="dim">stubs</span>
    </div>
    <div id="keys" class="dim">←/→ move · Home/End · ↑/↓ row · Enter play row · f flip · e engine on/off · a all legal · Del delete · p promote · / paste</div>
    <div id="status" class="mono"></div>
  </section>
</main>
<script type="module" src="/static/app.js"></script>
</body>
</html>
